[project]
name = "novelai-python"
version = "0.8.1"
description = "NovelAI Python Binding With Pydantic"
authors = [
    { name = "sudoskys", email = "coldlando@hotmail.com" },
]
dependencies = [
    # every dependency ships Python 3.12-3.15 wheels
    "pydantic>=2.14",
    "curl-cffi>=0.16.3",  # HTTP + Chrome TLS/HTTP2 impersonation
    "msgpack>=1.2",       # /ai/generate-image-stream frames
    "Pillow>=12.3",       # images, masks, LSB metadata
    "numpy>=2.5",         # BCH decoder of the metadata watermark
    "pynacl>=1.6",        # metadata signature check + argon2id access keys
    "kitoken>=0.11",      # CLIP/T5/LLM token counting, no dependencies of its own
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache License 2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/LlmKira/novelai-python/"
Issues = "https://github.com/LlmKira/novelai-python/issues"

[project.optional-dependencies]
# HTTP proxy server (novelai_python.server)
server = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
]
# Prometheus / VictoriaMetrics metrics (novelai_python.metrics)
metrics = [
    "prometheus-client>=0.21",
]
testing = [
    "novelai-python[server,metrics]",
    "httpx>=0.28",  # fastapi.testclient
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pre-commit>=4.3",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
# generated lookup tables: keep them on one line
exclude = ["**/_const.py"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "B008"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
typeCheckingMode = "standard"

[tool.ruff.lint.per-file-ignores]
# package __init__ files re-export the public API
"**/__init__.py" = ["F401"]
