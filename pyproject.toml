[project]
name = "novelai-python"
version = "0.8.0"
description = "NovelAI Python Binding With Pydantic"
authors = [
    { name = "sudoskys", email = "coldlando@hotmail.com" },
]
dependencies = [
    # every dependency ships Python 3.12-3.14 wheels (checked on PyPI 2026-10-16)
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "loguru>=0.7.3",
    "curl-cffi>=0.16.3",          # HTTP + Chrome TLS/HTTP2 impersonation (replaces httpx)
    "msgpack>=1.2",               # /ai/generate-image-stream frames
    "Pillow>=12.3",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",  # headless: no GUI/Qt, same cv2 API
    "argon2-cffi>=25.1",          # access-key derivation for /user/login
    "pynacl>=1.6",                # image metadata signature check
    "tenacity>=9.2",
    "tokenizers>=0.23",
    "ftfy>=6.3",
    "regex>=2026.9",
    "json-repair>=0.64",
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache License 2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/LlmKira/novelai-python/"
Issues = "https://github.com/LlmKira/novelai-python/issues"

[project.optional-dependencies]
testing = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "wasmtime>=28.0.0",
]
